<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-label="Document Embedder overview">
  <defs>
    <!-- The dashboard lays a purple wash over the lower half of this banner, so the art
         is built light at the top and already purple at the bottom: the wash deepens it
         instead of muddying a light area. -->
    <linearGradient id="sky" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#f4f5ff" />
      <stop offset="0.52" stop-color="#e5e4ff" />
      <stop offset="1" stop-color="#4a3ed2" />
    </linearGradient>

    <radialGradient id="glow" cx="0.5" cy="0.16" r="0.62">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <filter id="card" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#241c63" flood-opacity="0.22" />
    </filter>

    <filter id="chip" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#241c63" flood-opacity="0.20" />
    </filter>

    <clipPath id="paper">
      <rect x="228" y="118" width="444" height="252" />
    </clipPath>

    <g id="fold">
      <path d="M0 0h72l26 26v96H0z" fill="#ffffff" />
      <path d="M72 0l26 26H72z" fill="#e6e8f5" />
    </g>
  </defs>

  <rect width="900" height="600" fill="url(#sky)" />
  <rect width="900" height="600" fill="url(#glow)" />

  <!-- ================= the embed itself ================= -->
  <g filter="url(#card)">
    <rect x="210" y="62" width="480" height="308" fill="#ffffff" />
  </g>

  <!-- toolbar, in the plugin's own default dark -->
  <rect x="210" y="62" width="480" height="46" fill="#343434" />
  <rect x="230" y="79" width="104" height="12" fill="#ffffff" opacity="0.85" />
  <g fill="#ffffff" opacity="0.55">
    <path d="M392 79h10v12h-10z" />
    <path d="M414 79h34v12h-34z" />
    <path d="M460 79h10v12h-10z" />
  </g>
  <rect x="590" y="76" width="82" height="18" fill="#3858e9" />
  <g fill="#ffffff" opacity="0.92">
    <rect x="604" y="83" width="42" height="5" />
    <path d="M654 81l5 6 5-6z" />
  </g>

  <!-- page -->
  <rect x="210" y="108" width="480" height="262" fill="#f6f7f9" />
  <rect x="228" y="118" width="444" height="252" fill="#ffffff" />
  <g clip-path="url(#paper)">
    <rect x="252" y="146" width="196" height="16" fill="#c9cddb" />
    <g fill="#e2e5ee">
      <rect x="252" y="184" width="396" height="10" />
      <rect x="252" y="204" width="396" height="10" />
      <rect x="252" y="224" width="284" height="10" />
    </g>
    <!-- a figure on the page, so it reads as a real document and not just ruled lines -->
    <rect x="252" y="256" width="180" height="96" fill="#eef0fb" />
    <path d="M252 330l42-38 34 30 30-26 74 62v24h-180z" fill="#c3c9ea" />
    <circle cx="292" cy="284" r="12" fill="#ffd25c" />
    <g fill="#e2e5ee">
      <rect x="452" y="256" width="196" height="10" />
      <rect x="452" y="276" width="196" height="10" />
      <rect x="452" y="296" width="150" height="10" />
      <rect x="452" y="330" width="196" height="10" />
      <rect x="452" y="350" width="120" height="10" />
    </g>
  </g>

  <!-- ================= the formats it takes ================= -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="700" font-size="19" fill="#ffffff">

    <g transform="rotate(-8 128 176)" filter="url(#card)">
      <use href="#fold" x="80" y="116" />
      <g fill="#dfe3ee">
        <rect x="94" y="164" width="44" height="7" />
        <rect x="94" y="180" width="44" height="7" />
      </g>
      <rect x="80" y="200" width="58" height="26" fill="#e5484d" />
      <text x="109" y="219" text-anchor="middle">PDF</text>
    </g>

    <g transform="rotate(6 138 366)" filter="url(#card)">
      <use href="#fold" x="90" y="306" />
      <g fill="#dfe3ee">
        <rect x="104" y="354" width="44" height="7" />
        <rect x="104" y="370" width="44" height="7" />
      </g>
      <rect x="90" y="390" width="66" height="26" fill="#e07024" />
      <text x="123" y="409" text-anchor="middle">PPTX</text>
    </g>

    <g transform="rotate(7 772 168)" filter="url(#card)">
      <use href="#fold" x="724" y="108" />
      <g fill="#dfe3ee">
        <rect x="738" y="156" width="44" height="7" />
        <rect x="738" y="172" width="44" height="7" />
      </g>
      <rect x="724" y="192" width="70" height="26" fill="#2b66c9" />
      <text x="759" y="211" text-anchor="middle">DOCX</text>
    </g>

    <g transform="rotate(-6 762 358)" filter="url(#card)">
      <use href="#fold" x="714" y="298" />
      <g fill="#dfe3ee">
        <rect x="728" y="346" width="44" height="7" />
        <rect x="728" y="362" width="44" height="7" />
      </g>
      <rect x="714" y="382" width="66" height="26" fill="#1d9a3a" />
      <text x="747" y="401" text-anchor="middle">XLSX</text>
    </g>
  </g>

  <!-- cloud sources, tucked against the embed -->
  <g filter="url(#chip)">
    <rect x="556" y="24" width="196" height="42" fill="#ffffff" />
  </g>
  <g transform="translate(574 36)" fill="none" stroke="#6155f5" stroke-width="2">
    <path d="M5.5 15.5a5 5 0 0 1 .8-9.9A7 7 0 0 1 19.6 7a4.3 4.3 0 0 1-.6 8.5z" />
    <path d="M12.5 10v7M9 13.2l3.5-3.4 3.5 3.4" />
  </g>
  <text x="608" y="51" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#2b2a4a">Drive &amp; Dropbox</text>

  <!-- ================= how it goes on the page ================= -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">

    <g filter="url(#chip)">
      <rect x="96" y="452" width="214" height="54" fill="#ffffff" />
    </g>
    <rect x="118" y="468" width="22" height="22" fill="#6155f5" />
    <path d="M124 474h10v10h-10z" fill="#ffffff" />
    <text x="150" y="486" font-size="18" font-weight="600" fill="#2b2a4a">Gutenberg block</text>

    <g filter="url(#chip)">
      <rect x="340" y="452" width="200" height="54" fill="#2b2a4a" />
    </g>
    <text x="440" y="486" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#ffffff">[doc id="12"]</text>

    <g filter="url(#chip)">
      <rect x="570" y="452" width="228" height="54" fill="#ffffff" />
    </g>
    <g fill="#6155f5">
      <rect x="592" y="468" width="9" height="9" />
      <rect x="605" y="468" width="9" height="9" />
      <rect x="592" y="481" width="9" height="9" />
      <rect x="605" y="481" width="9" height="9" />
    </g>
    <text x="626" y="486" font-size="18" font-weight="600" fill="#2b2a4a">Document Library</text>

    <text x="450" y="558" text-anchor="middle" font-size="21" font-weight="600" fill="#ffffff">Embed any document. Nothing for your visitors to download.</text>
  </g>
</svg>
